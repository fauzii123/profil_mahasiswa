<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Kuliah</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 80%;
            max-width: 800px;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            color: #2563eb;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #2563eb;
            color: white;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Jadwal Kuliah</h1>

        <table>
            <tr>
                <th>Hari</th>
                <th>Mata Kuliah</th>
                <th>Jam</th>
            </tr>

            <tr>
                <td>Senin</td>
                <td>Sistem Terdistribusi</td>
                <td>08.00 - 10.00</td>
            </tr>

            <tr>
                <td>Selasa</td>
                <td>Kecerdasan Buatan</td>
                <td>10.00 - 12.00</td>
            </tr>

            <tr>
                <td>Rabu</td>
                <td>Grafika Komputer</td>
                <td>08.00 - 10.00</td>
            </tr>
        </table>

        <a href="index.html">← Kembali ke Halaman Utama</a>

    </div>

</body>
</html>
